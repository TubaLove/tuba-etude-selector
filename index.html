<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuba Etude Selector Pro</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        /* カスタムスクロールバー */
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .history-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- アイコン ---
        const InstagramIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>);
        const CheckIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>);
        const GlobeIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>);
        const DiceIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 8h.01"></path><path d="M8 8h.01"></path><path d="M8 16h.01"></path><path d="M16 16h.01"></path><path d="M12 12h.01"></path></svg>);
        const ChevronDown = ({ isOpen }) => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}><polyline points="6 9 12 15 18 9"></polyline></svg>);
        const CalendarIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>);

        function TubaEtudeSelector() {
          const [selectedEtude, setSelectedEtude] = useState(null);
          const [periodKey, setPeriodKey] = useState('today'); 
          const [lang, setLang] = useState('ja'); 
          const [copyStatus, setCopyStatus] = useState(false);
          const [expandedBook, setExpandedBook] = useState(null); // 履歴展開用

          const etudes = {
            bordogni: { name: 'Bordogni', max: 43 },
            kopprasch: { name: 'Kopprasch', max: 60 },
            blazevich: { name: 'Blazhevich', max: 70 }
          };

          const [enabledEtudes, setEnabledEtudes] = useState({
            bordogni: true,
            kopprasch: true,
            blazevich: true
          });

          // 履歴データの構造変更: { key: { number: "YYYY/MM/DD" } }
          const [history, setHistory] = useState(() => {
            const saved = localStorage.getItem('tubaPracticeHistoryV2');
            if (saved) {
                return JSON.parse(saved);
            }
            // 旧データの移行処理（配列 -> オブジェクト）
            const oldSaved = localStorage.getItem('tubaPracticeHistory');
            if (oldSaved) {
                const oldData = JSON.parse(oldSaved);
                const newData = { bordogni: {}, kopprasch: {}, blazevich: {} };
                // 旧データがある場合、日付は「Unknown」として移行
                Object.keys(oldData).forEach(key => {
                    if (Array.isArray(oldData[key])) {
                        oldData[key].forEach(num => {
                            newData[key][num] = "Old Record"; 
                        });
                    }
                });
                return newData;
            }
            return { bordogni: {}, kopprasch: {}, blazevich: {} };
          });

          useEffect(() => {
            localStorage.setItem('tubaPracticeHistoryV2', JSON.stringify(history));
          }, [history]);

          // 教則本の選択トグル（ここを修正：inputのonChangeを確実に発火させる）
          const handleToggleEtude = (key) => {
            setEnabledEtudes(prev => ({ ...prev, [key]: !prev[key] }));
          };

          // 履歴の開閉
          const toggleHistoryView = (key) => {
            setExpandedBook(expandedBook === key ? null : key);
          };

          const generateRandom = () => {
            const enabledKeys = Object.keys(enabledEtudes).filter(key => enabledEtudes[key]);
            
            if (enabledKeys.length === 0) {
              alert(lang === 'ja' ? '教則本を選択してください' : 'Please select at least one etude book');
              return;
            }

            // 全候補を作成（完了済みも含む）
            let availableOptions = [];
            enabledKeys.forEach(key => {
              const max = etudes[key].max;
              for (let i = 1; i <= max; i++) {
                 availableOptions.push({ key: key, number: i });
              }
            });

            const randomPick = availableOptions[Math.floor(Math.random() * availableOptions.length)];
            
            // 過去の実施日を取得
            const lastPlayed = history[randomPick.key]?.[randomPick.number] || null;

            setSelectedEtude({
              key: randomPick.key,
              name: etudes[randomPick.key].name,
              number: randomPick.number,
              lastPlayed: lastPlayed
            });
            setCopyStatus(false);
          };

          const markAsComplete = () => {
            if (!selectedEtude) return;

            const today = new Date().toLocaleDateString(lang === 'ja' ? 'ja-JP' : 'en-US');

            setHistory(prev => ({
              ...prev,
              [selectedEtude.key]: {
                  ...(prev[selectedEtude.key] || {}),
                  [selectedEtude.number]: today
              }
            }));
            
            // 完了したら次のために「前回実施日」を更新して表示維持、または閉じる？
            // ここでは完了後も表示を残し、再度ボタンを押せるようにします
            setSelectedEtude(prev => ({...prev, lastPlayed: today}));
          };

          const resetHistory = () => {
            const msg = lang === 'ja' ? '練習履歴をすべてリセットしますか？' : 'Are you sure you want to reset all practice history?';
            if (confirm(msg)) {
              setHistory({ bordogni: {}, kopprasch: {}, blazevich: {} });
              setSelectedEtude(null);
            }
          };

          const shareToInstagram = () => {
            if (!selectedEtude) return;
            let text = "";
            const bookName = selectedEtude.name;
            const number = selectedEtude.number;
            if (lang === 'ja') {
                const timeMap = { today: '今日は', week: '今週は', month: '今月は' };
                const timeStr = timeMap[periodKey];
                text = `${timeStr}${bookName}の${number}番を練習します！\n\n#TubaEtudeSelector #基礎練習 #Tuba #${bookName}`;
            } else {
                const timeMap = { today: 'today', week: 'this week', month: 'this month' };
                const timeStr = timeMap[periodKey];
                text = `I'm practicing ${bookName} No.${number} ${timeStr}!\n\n#TubaEtudeSelector #DailyPractice #Tuba #${bookName}`;
            }
            navigator.clipboard.writeText(text).then(() => {
              setCopyStatus(true);
              setTimeout(() => {
                window.location.href = 'instagram://app';
                setTimeout(() => { window.open('https://www.instagram.com/', '_blank'); }, 500);
              }, 1000);
            }).catch(() => alert('Failed to copy text.'));
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 p-6 flex items-center justify-center font-sans">
              <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
                
                {/* ヘッダー */}
                <div className="bg-blue-600 p-6 text-white text-center">
                    <h1 className="text-2xl font-bold tracking-tight">Tuba Etude Selector</h1>
                    <p className="text-blue-100 text-sm mt-1">Practice Tracker & Randomizer</p>
                </div>

                <div className="p-6">
                  {/* 教則本選択エリア */}
                  <div className="mb-6">
                    <h2 className="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3 flex justify-between">
                        <span>Select Books</span>
                        <span className="text-xs font-normal normal-case">Tap name for history</span>
                    </h2>
                    
                    <div className="space-y-3">
                      {Object.entries(etudes).map(([key, etude]) => {
                        // 履歴カウント計算
                        const doneCount = Object.keys(history[key] || {}).length;
                        const progress = Math.round((doneCount / etude.max) * 100);
                        const isExpanded = expandedBook === key;

                        return (
                          <div key={key} className="bg-white border border-gray-200 rounded-xl overflow-hidden transition-all shadow-sm hover:shadow-md">
                              {/* メイン行 */}
                              <div className="flex items-center p-3">
                                  {/* チェックボックス (選択用) */}
                                  <div 
                                    className="flex items-center cursor-pointer p-2 -ml-2 rounded-lg hover:bg-gray-100"
                                    onClick={(e) => {
                                        e.stopPropagation(); // 親への伝播を止める
                                        handleToggleEtude(key);
                                    }}
                                  >
                                      <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${enabledEtudes[key] ? 'bg-blue-600 border-blue-600' : 'border-gray-300 bg-white'}`}>
                                          {enabledEtudes[key] && <CheckIcon />}
                                      </div>
                                  </div>

                                  {/* タイトル＆進捗 (履歴開閉用) */}
                                  <div 
                                    className="flex-1 flex items-center justify-between ml-2 cursor-pointer"
                                    onClick={() => toggleHistoryView(key)}
                                  >
                                      <span className="text-gray-700 font-medium hover:text-blue-600 transition-colors">
                                          {etude.name}
                                      </span>
                                      
                                      <div className="flex items-center gap-3">
                                          <div className="flex flex-col items-end">
                                              <span className="text-xs font-bold text-gray-500">{doneCount}/{etude.max}</span>
                                              <div className="w-16 h-1 bg-gray-200 rounded-full mt-1 overflow-hidden">
                                                  <div className="h-full bg-blue-500" style={{width: `${progress}%`}}></div>
                                              </div>
                                          </div>
                                          <ChevronDown isOpen={isExpanded} />
                                      </div>
                                  </div>
                              </div>

                              {/* 履歴詳細エリア (アコーディオン) */}
                              {isExpanded && (
                                  <div className="bg-gray-50 p-3 border-t border-gray-100 animate-fade-in">
                                      <div className="flex justify-between items-center mb-2">
                                          <span className="text-xs font-bold text-gray-500">Practiced History</span>
                                      </div>
                                      {doneCount === 0 ? (
                                          <div className="text-xs text-gray-400 text-center py-2">No history yet.</div>
                                      ) : (
                                          <div className="max-h-32 overflow-y-auto history-scroll grid grid-cols-3 gap-2">
                                              {/* 履歴があるものをリストアップ（番号順にソート） */}
                                              {Object.entries(history[key])
                                                  .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
                                                  .map(([num, date]) => (
                                                      <div key={num} className="bg-white px-2 py-1 rounded border border-gray-200 flex flex-col items-center">
                                                          <span className="text-xs font-bold text-blue-600">No.{num}</span>
                                                          <span className="text-[10px] text-gray-400">{date === "Old Record" ? "-" : date}</span>
                                                      </div>
                                                  ))
                                              }
                                          </div>
                                      )}
                                  </div>
                              )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* 結果表示エリア */}
                  {selectedEtude && (
                    <div className="animate-fade-in mb-6">
                      <div className="bg-gradient-to-br from-slate-50 to-blue-50 rounded-2xl p-6 border border-blue-100 text-center shadow-inner relative">
                        
                        {/* ツールバー */}
                        <div className="flex justify-end gap-2 mb-4">
                            <div className="relative">
                                <GlobeIcon className="absolute left-2 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4 pointer-events-none" />
                                <select value={lang} onChange={(e) => setLang(e.target.value)} className="pl-8 pr-2 py-1 bg-white text-xs font-bold text-gray-600 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 shadow-sm appearance-none cursor-pointer">
                                    <option value="ja">🇯🇵 JP</option>
                                    <option value="en">🇺🇸 EN</option>
                                </select>
                            </div>
                            <select value={periodKey} onChange={(e) => setPeriodKey(e.target.value)} className="bg-white text-xs text-gray-600 border border-gray-200 rounded-lg px-2 py-1 focus:outline-none focus:border-blue-500 shadow-sm cursor-pointer">
                                <option value="today">{lang === 'ja' ? '今日' : 'Today'}</option>
                                <option value="week">{lang === 'ja' ? '今週' : 'This Week'}</option>
                                <option value="month">{lang === 'ja' ? '今月' : 'This Month'}</option>
                            </select>
                        </div>

                        <div className="text-xs font-bold text-blue-500 uppercase tracking-widest mb-2">Let's Play</div>
                        <div className="text-xl font-bold text-gray-800 mb-1">{selectedEtude.name}</div>
                        <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-2">
                          No. {selectedEtude.number}
                        </div>

                        {/* 前回実施日の表示 */}
                        <div className="h-6 mb-4 flex justify-center items-center">
                            {selectedEtude.lastPlayed ? (
                                <span className="text-xs font-medium text-amber-600 bg-amber-100 px-2 py-1 rounded-full flex items-center gap-1">
                                    <CalendarIcon />
                                    Last: {selectedEtude.lastPlayed}
                                </span>
                            ) : (
                                <span className="text-xs font-medium text-emerald-600 bg-emerald-100 px-2 py-1 rounded-full">
                                    New / First Time
                                </span>
                            )}
                        </div>
                        
                        {/* アクションボタン */}
                        <div className="flex flex-col gap-3">
                            <button onClick={generateRandom} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all duration-200 shadow-md flex items-center justify-center gap-2 active:scale-95">
                                <DiceIcon /> Random Select
                            </button>

                            <button onClick={markAsComplete} className="w-full bg-white border-2 border-green-500 text-green-600 hover:bg-green-50 font-bold py-3 px-4 rounded-xl transition-colors text-sm flex items-center justify-center gap-2 active:scale-95">
                                <CheckIcon /> Mark as Done (Save Date)
                            </button>

                            <button onClick={shareToInstagram} className={`w-full py-3 px-4 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2 shadow-sm active:scale-95 ${copyStatus ? 'bg-green-500 text-white' : 'bg-gradient-to-r from-pink-500 to-orange-400 text-white hover:shadow-md'}`}>
                                {copyStatus ? (<><CheckIcon /> {lang === 'ja' ? 'コピーしました！' : 'Copied!'}</>) : (<><InstagramIcon /> Share Result</>)}
                            </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {!selectedEtude && (
                    <div className="space-y-4">
                        <button onClick={generateRandom} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-blue-200 active:scale-95 flex items-center justify-center gap-2">
                        <DiceIcon /> Random Select
                        </button>
                    </div>
                  )}

                  <div className="mt-6 text-center">
                    <button onClick={resetHistory} className="text-gray-400 hover:text-red-500 text-xs font-medium py-2 transition-colors">
                      Reset History
                    </button>
                  </div>

                </div>
              </div>
            </div>
          );
        }
        ReactDOM.render(<TubaEtudeSelector />, document.getElementById('root'));
    </script>
</body>
</html>
