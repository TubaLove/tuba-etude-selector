<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuba Etude Selector (Save Mode)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function TubaEtudeSelector() {
          const [selectedEtude, setSelectedEtude] = useState(null);
          
          // 教則本の設定
          const etudes = {
            bordogni: { name: 'Bordogni', max: 43 },
            kopprasch: { name: 'Kopprasch', max: 60 },
            blazevich: { name: 'Blazhevich', max: 70 }
          };

          const [enabledEtudes, setEnabledEtudes] = useState({
            bordogni: true,
            kopprasch: true,
            blazevich: true
          });

          // 【追加機能】練習済みの曲を管理するState
          // 初期値はローカルストレージから読み込む。なければ空のオブジェクト。
          const [completedEtudes, setCompletedEtudes] = useState(() => {
            const saved = localStorage.getItem('tubaPracticeHistory');
            return saved ? JSON.parse(saved) : { bordogni: [], kopprasch: [], blazevich: [] };
          });

          // completedEtudesが変わるたびにローカルストレージに自動保存
          useEffect(() => {
            localStorage.setItem('tubaPracticeHistory', JSON.stringify(completedEtudes));
          }, [completedEtudes]);

          const toggleEtude = (key) => {
            setEnabledEtudes(prev => ({
              ...prev,
              [key]: !prev[key]
            }));
          };

          // 抽選ロジック（練習済みを除外）
          const generateRandom = () => {
            const enabledKeys = Object.keys(enabledEtudes).filter(key => enabledEtudes[key]);
            
            if (enabledKeys.length === 0) {
              alert('Please select at least one etude book');
              return;
            }

            // 選ばれた教則本の中から、「まだやっていない曲」のリストを作る
            let availableOptions = [];
            
            enabledKeys.forEach(key => {
              const max = etudes[key].max;
              const completedList = completedEtudes[key] || []; // その本の完了済みリスト
              
              for (let i = 1; i <= max; i++) {
                // 完了リストに含まれていなければ候補に入れる
                if (!completedList.includes(i)) {
                  availableOptions.push({ key: key, number: i });
                }
              }
            });

            if (availableOptions.length === 0) {
              alert('Amazing! You have completed all etudes in the selected books! 🎉 (Reset history to start over)');
              return;
            }

            // 候補の中からランダムに1つ選ぶ
            const randomPick = availableOptions[Math.floor(Math.random() * availableOptions.length)];
            
            setSelectedEtude({
              key: randomPick.key, // どの本か識別するためにキーも保存
              name: etudes[randomPick.key].name,
              number: randomPick.number
            });
          };

          // 現在表示されている曲を「練習済み」にする
          const markAsComplete = () => {
            if (!selectedEtude) return;

            setCompletedEtudes(prev => ({
              ...prev,
              [selectedEtude.key]: [...(prev[selectedEtude.key] || []), selectedEtude.number]
            }));
            
            setSelectedEtude(null); // 完了したら表示を消す（または次の曲へ）
            // alert('Marked as complete!'); // 必要ならコメントアウトを外す
          };

          // 履歴のリセット
          const resetHistory = () => {
            if (confirm('Are you sure you want to reset all practice history?')) {
              setCompletedEtudes({ bordogni: [], kopprasch: [], blazevich: [] });
              setSelectedEtude(null);
            }
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-cyan-100 p-8 flex items-center justify-center">
              <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
                <div className="text-center mb-8">
                  <h1 className="text-3xl font-bold text-gray-800 mb-2">
                    Tuba Etude Selector
                  </h1>
                  <p className="text-gray-600">Track your progress (Saved in browser)</p>
                </div>

                <div className="mb-6">
                  <h2 className="text-lg font-semibold text-gray-700 mb-3">Select Books:</h2>
                  <div className="space-y-2">
                    {Object.entries(etudes).map(([key, etude]) => {
                      // 進捗状況を計算（完了数 / 全曲数）
                      const doneCount = (completedEtudes[key] || []).length;
                      return (
                        <label
                          key={key}
                          className="flex items-center justify-between p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors border border-gray-100"
                        >
                          <div className="flex items-center gap-3">
                            <input
                              type="checkbox"
                              checked={enabledEtudes[key]}
                              onChange={() => toggleEtude(key)}
                              className="w-5 h-5 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
                            />
                            <span className="text-gray-700 font-medium">
                              {etude.name}
                            </span>
                          </div>
                          <span className="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-full">
                            {doneCount} / {etude.max} Done
                          </span>
                        </label>
                      );
                    })}
                  </div>
                </div>

                {selectedEtude && (
                  <div className="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-lg p-6 border-2 border-blue-200 mb-6 text-center animate-fade-in">
                    <div className="text-sm text-gray-600 mb-1">Let's Practice!</div>
                    <div className="text-2xl font-bold text-blue-600 mb-1">
                      {selectedEtude.name}
                    </div>
                    <div className="text-4xl font-bold text-gray-800 mb-4">
                      No. {selectedEtude.number}
                    </div>
                    
                    {/* 完了ボタン */}
                    <button 
                      onClick={markAsComplete}
                      className="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2 mx-auto"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                      Mark as Done
                    </button>
                  </div>
                )}

                <div className="space-y-4">
                  <button
                    onClick={generateRandom}
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 shadow-lg"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M21 2v6h-6"></path>
                      <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                    </svg>
                    Random Select (Unplayed)
                  </button>

                  <button
                    onClick={resetHistory}
                    className="w-full text-gray-400 hover:text-red-500 text-sm font-medium py-2 transition-colors"
                  >
                    Reset History
                  </button>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<TubaEtudeSelector />, document.getElementById('root'));
    </script>
</body>
</html>
