<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuba Etude Selector</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        // アイコンコンポーネント
        const InstagramIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        );
        const CheckIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        );

        function TubaEtudeSelector() {
          const [selectedEtude, setSelectedEtude] = useState(null);
          const [timeFrame, setTimeFrame] = useState('今日は'); // 期間選択用
          const [copyStatus, setCopyStatus] = useState(false); // コピー完了表示用
          
          const etudes = {
            bordogni: { name: 'Bordogni', max: 43 },
            kopprasch: { name: 'Kopprasch', max: 60 },
            blazevich: { name: 'Blazhevich', max: 70 }
          };

          const [enabledEtudes, setEnabledEtudes] = useState({
            bordogni: true,
            kopprasch: true,
            blazevich: true
          });

          // ローカルストレージ設定
          const [completedEtudes, setCompletedEtudes] = useState(() => {
            const saved = localStorage.getItem('tubaPracticeHistory');
            return saved ? JSON.parse(saved) : { bordogni: [], kopprasch: [], blazevich: [] };
          });

          useEffect(() => {
            localStorage.setItem('tubaPracticeHistory', JSON.stringify(completedEtudes));
          }, [completedEtudes]);

          const toggleEtude = (key) => {
            setEnabledEtudes(prev => ({ ...prev, [key]: !prev[key] }));
          };

          const generateRandom = () => {
            const enabledKeys = Object.keys(enabledEtudes).filter(key => enabledEtudes[key]);
            if (enabledKeys.length === 0) {
              alert('Please select at least one etude book');
              return;
            }

            let availableOptions = [];
            enabledKeys.forEach(key => {
              const max = etudes[key].max;
              const completedList = completedEtudes[key] || [];
              for (let i = 1; i <= max; i++) {
                if (!completedList.includes(i)) {
                  availableOptions.push({ key: key, number: i });
                }
              }
            });

            if (availableOptions.length === 0) {
              alert('Amazing! All etudes completed! 🎉');
              return;
            }

            const randomPick = availableOptions[Math.floor(Math.random() * availableOptions.length)];
            setSelectedEtude({
              key: randomPick.key,
              name: etudes[randomPick.key].name,
              number: randomPick.number
            });
            setCopyStatus(false); // リセット
          };

          const markAsComplete = () => {
            if (!selectedEtude) return;
            setCompletedEtudes(prev => ({
              ...prev,
              [selectedEtude.key]: [...(prev[selectedEtude.key] || []), selectedEtude.number]
            }));
            setSelectedEtude(null);
          };

          const resetHistory = () => {
            if (confirm('Are you sure you want to reset all practice history?')) {
              setCompletedEtudes({ bordogni: [], kopprasch: [], blazevich: [] });
              setSelectedEtude(null);
            }
          };

          // ★ Instagramシェア機能
          const shareToInstagram = () => {
            if (!selectedEtude) return;

            // シェアする文章の作成
            const text = `${timeFrame}${selectedEtude.name}の${selectedEtude.number}番を練習します！\n\n#TubaEtudeSelector #基礎練習 #Tuba #${selectedEtude.name} #TubaPractice`;

            // クリップボードにコピー
            navigator.clipboard.writeText(text).then(() => {
              setCopyStatus(true);
              
              // 1.5秒後にInstagramを開く
              setTimeout(() => {
                // スマホならアプリ、PCならWebサイトへ
                window.location.href = 'instagram://app'; 
                // バックアップとしてWeb版へのリンクも用意（アプリが起動しない場合用）
                setTimeout(() => {
                    window.open('https://www.instagram.com/', '_blank');
                }, 500);
              }, 1000);
            }).catch(err => {
              console.error('Copy failed', err);
              alert('Failed to copy text manually.');
            });
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 p-6 flex items-center justify-center font-sans">
              <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
                
                {/* ヘッダーエリア */}
                <div className="bg-blue-600 p-6 text-white text-center">
                    <h1 className="text-2xl font-bold tracking-tight">Tuba Etude Selector</h1>
                    <p className="text-blue-100 text-sm mt-1">Daily Practice Randomizer</p>
                </div>

                <div className="p-8">
                  {/* 教則本選択エリア */}
                  <div className="mb-8">
                    <h2 className="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">Select Books</h2>
                    <div className="space-y-3">
                      {Object.entries(etudes).map(([key, etude]) => {
                        const doneCount = (completedEtudes[key] || []).length;
                        const progress = Math.round((doneCount / etude.max) * 100);
                        
                        return (
                          <label key={key} className="group flex items-center justify-between p-3 rounded-xl border border-gray-200 hover:border-blue-400 hover:bg-blue-50 transition-all cursor-pointer">
                            <div className="flex items-center gap-3">
                              <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${enabledEtudes[key] ? 'bg-blue-600 border-blue-600' : 'border-gray-300 bg-white'}`}>
                                {enabledEtudes[key] && <CheckIcon className="text-white w-3 h-3" />}
                              </div>
                              <input type="checkbox" checked={enabledEtudes[key]} onChange={() => toggleEtude(key)} className="hidden" />
                              <span className="text-gray-700 font-medium group-hover:text-blue-700">{etude.name}</span>
                            </div>
                            <div className="flex flex-col items-end">
                                <span className="text-xs font-bold text-gray-500">{doneCount}/{etude.max}</span>
                                <div className="w-16 h-1 bg-gray-200 rounded-full mt-1 overflow-hidden">
                                    <div className="h-full bg-blue-500" style={{width: `${progress}%`}}></div>
                                </div>
                            </div>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  {/* 結果表示エリア */}
                  {selectedEtude && (
                    <div className="animate-fade-in mb-8">
                      <div className="bg-gradient-to-br from-slate-50 to-blue-50 rounded-2xl p-6 border border-blue-100 text-center shadow-inner relative overflow-hidden">
                        
                        {/* 期間選択セレクター */}
                        <div className="absolute top-4 right-4">
                            <select 
                                value={timeFrame} 
                                onChange={(e) => setTimeFrame(e.target.value)}
                                className="bg-white text-xs text-gray-600 border border-gray-200 rounded-lg px-2 py-1 focus:outline-none focus:border-blue-500 shadow-sm"
                            >
                                <option value="今日は">Today</option>
                                <option value="今週は">This Week</option>
                                <option value="今月は">This Month</option>
                            </select>
                        </div>

                        <div className="text-xs font-bold text-blue-500 uppercase tracking-widest mb-2 mt-2">Let's Play</div>
                        <div className="text-xl font-bold text-gray-800 mb-1">{selectedEtude.name}</div>
                        <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-6">
                          No. {selectedEtude.number}
                        </div>
                        
                        {/* アクションボタン群 */}
                        <div className="flex flex-col gap-3">
                            {/* Instagramシェアボタン */}
                            <button 
                                onClick={shareToInstagram}
                                className={`w-full py-3 px-4 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2 shadow-sm
                                    ${copyStatus 
                                        ? 'bg-green-500 text-white transform scale-95' 
                                        : 'bg-gradient-to-r from-pink-500 to-orange-400 text-white hover:shadow-md hover:-translate-y-0.5'
                                    }`}
                            >
                                {copyStatus ? (
                                    <>
                                        <CheckIcon /> Copied! Opening Insta...
                                    </>
                                ) : (
                                    <>
                                        <InstagramIcon /> Share Result
                                    </>
                                )}
                            </button>

                            {/* 完了ボタン */}
                            <button 
                              onClick={markAsComplete}
                              className="w-full bg-white border-2 border-green-500 text-green-600 hover:bg-green-50 font-bold py-3 px-4 rounded-xl transition-colors text-sm flex items-center justify-center gap-2"
                            >
                              <CheckIcon /> Mark as Done
                            </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* メイン操作ボタン */}
                  <div className="space-y-4">
                    {!selectedEtude && (
                        <button
                        onClick={generateRandom}
                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-blue-200 active:scale-95 flex items-center justify-center gap-2"
                        >
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                        Random Select
                        </button>
                    )}

                    <button
                      onClick={resetHistory}
                      className="w-full text-gray-400 hover:text-red-500 text-xs font-medium py-2 transition-colors"
                    >
                      Reset History
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<TubaEtudeSelector />, document.getElementById('root'));
    </script>
</body>
</html>
