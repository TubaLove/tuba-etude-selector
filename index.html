<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuba Etude Selector</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- アイコン ---
        const InstagramIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        );
        const CheckIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        const GlobeIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        );
        const DiceIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 8h.01"></path><path d="M8 8h.01"></path><path d="M8 16h.01"></path><path d="M16 16h.01"></path><path d="M12 12h.01"></path></svg>
        );

        function TubaEtudeSelector() {
          const [selectedEtude, setSelectedEtude] = useState(null);
          
          // --- 設定系 State ---
          const [periodKey, setPeriodKey] = useState('today'); // today, week, month
          const [lang, setLang] = useState('ja'); // ja, en
          const [copyStatus, setCopyStatus] = useState(false);

          // --- データ ---
          const etudes = {
            bordogni: { name: 'Bordogni', max: 43 },
            kopprasch: { name: 'Kopprasch', max: 60 },
            blazevich: { name: 'Blazhevich', max: 70 }
          };

          const [enabledEtudes, setEnabledEtudes] = useState({
            bordogni: true,
            kopprasch: true,
            blazevich: true
          });

          // 履歴の保存
          const [completedEtudes, setCompletedEtudes] = useState(() => {
            const saved = localStorage.getItem('tubaPracticeHistory');
            return saved ? JSON.parse(saved) : { bordogni: [], kopprasch: [], blazevich: [] };
          });

          useEffect(() => {
            localStorage.setItem('tubaPracticeHistory', JSON.stringify(completedEtudes));
          }, [completedEtudes]);

          // --- ロジック ---
          const toggleEtude = (key) => {
            setEnabledEtudes(prev => ({ ...prev, [key]: !prev[key] }));
          };

          const generateRandom = () => {
            const enabledKeys = Object.keys(enabledEtudes).filter(key => enabledEtudes[key]);
            if (enabledKeys.length === 0) {
              alert(lang === 'ja' ? '教則本を選択してください' : 'Please select at least one etude book');
              return;
            }

            let availableOptions = [];
            enabledKeys.forEach(key => {
              const max = etudes[key].max;
              const completedList = completedEtudes[key] || [];
              for (let i = 1; i <= max; i++) {
                if (!completedList.includes(i)) {
                  availableOptions.push({ key: key, number: i });
                }
              }
            });

            if (availableOptions.length === 0) {
              alert(lang === 'ja' ? 'すべての曲を完了しました！🎉' : 'Amazing! All etudes completed! 🎉');
              return;
            }

            const randomPick = availableOptions[Math.floor(Math.random() * availableOptions.length)];
            setSelectedEtude({
              key: randomPick.key,
              name: etudes[randomPick.key].name,
              number: randomPick.number
            });
            setCopyStatus(false);
          };

          const markAsComplete = () => {
            if (!selectedEtude) return;
            setCompletedEtudes(prev => ({
              ...prev,
              [selectedEtude.key]: [...(prev[selectedEtude.key] || []), selectedEtude.number]
            }));
            setSelectedEtude(null);
          };

          const resetHistory = () => {
            const msg = lang === 'ja' ? '練習履歴をすべてリセットしますか？' : 'Are you sure you want to reset all practice history?';
            if (confirm(msg)) {
              setCompletedEtudes({ bordogni: [], kopprasch: [], blazevich: [] });
              setSelectedEtude(null);
            }
          };

          // --- シェア文章生成 ---
          const shareToInstagram = () => {
            if (!selectedEtude) return;

            let text = "";
            const bookName = selectedEtude.name;
            const number = selectedEtude.number;

            if (lang === 'ja') {
                const timeMap = { today: '今日は', week: '今週は', month: '今月は' };
                const timeStr = timeMap[periodKey];
                text = `${timeStr}${bookName}の${number}番を練習します！\n\n#TubaEtudeSelector #基礎練習 #Tuba #${bookName} #TubaPractice`;
            } else {
                const timeMap = { today: 'today', week: 'this week', month: 'this month' };
                const timeStr = timeMap[periodKey];
                text = `I'm practicing ${bookName} No.${number} ${timeStr}!\n\n#TubaEtudeSelector #DailyPractice #Tuba #${bookName} #LowBrass`;
            }

            navigator.clipboard.writeText(text).then(() => {
              setCopyStatus(true);
              setTimeout(() => {
                window.location.href = 'instagram://app';
                setTimeout(() => { window.open('https://www.instagram.com/', '_blank'); }, 500);
              }, 1000);
            }).catch(() => {
              alert('Failed to copy text.');
            });
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 p-6 flex items-center justify-center font-sans">
              <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
                
                {/* ヘッダー */}
                <div className="bg-blue-600 p-6 text-white text-center">
                    <h1 className="text-2xl font-bold tracking-tight">Tuba Etude Selector</h1>
                    <p className="text-blue-100 text-sm mt-1">Daily Practice Randomizer</p>
                </div>

                <div className="p-8">
                  {/* 教則本選択 */}
                  <div className="mb-6">
                    <h2 className="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">Select Books</h2>
                    <div className="space-y-3">
                      {Object.entries(etudes).map(([key, etude]) => {
                        const doneCount = (completedEtudes[key] || []).length;
                        const progress = Math.round((doneCount / etude.max) * 100);
                        return (
                          <label key={key} className="group flex items-center justify-between p-3 rounded-xl border border-gray-200 hover:border-blue-400 hover:bg-blue-50 transition-all cursor-pointer">
                            <div className="flex items-center gap-3">
                              <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${enabledEtudes[key] ? 'bg-blue-600 border-blue-600' : 'border-gray-300 bg-white'}`}>
                                {enabledEtudes[key] && <CheckIcon />}
                              </div>
                              <span className="text-gray-700 font-medium group-hover:text-blue-700">{etude.name}</span>
                            </div>
                            <div className="flex flex-col items-end">
